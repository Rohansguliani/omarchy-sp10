# Switch audio to Bluetooth headphones/speakers the moment they connect,
# however they connected (Bluetooth page, auto-reconnect, bluetoothctl).
# Without this, WirePlumber keeps the last output you picked, so a connected
# AirPods Max stayed silent while sound went to the dock.
#
# blocklist=^alsa_ limits it to Bluetooth: plugging in a dock, monitor or USB
# audio device doesn't steal the output.
pulse.cmd = [
  { cmd = "load-module" args = "module-switch-on-connect blocklist=^alsa_" flags = [ ] }
]
